debug: false
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-motorbike-guardian-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/guardian_db?currentSchema=public}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:guardian_user}
    password: "${SPRING_DATASOURCE_PASSWORD:}"

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:}
  realtime:
    command-timeout-seconds: ${COMMAND_TIMEOUT_SECONDS:10}
    offline-timeout-seconds: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:45}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}"
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://broker.emqx.io:1883}
    client-id: guardian-backend-service
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    connection-timeout: 3
    keep-alive-interval: 30
    auto-reconnect: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.guardian: INFO
    org.springframework.messaging: INFO
    org.springframework.web.socket: INFO

---
# H2 In-Memory Profile (chạy độc lập không cần Docker)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:guardian_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
