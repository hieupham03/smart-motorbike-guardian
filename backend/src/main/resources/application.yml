server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-motorbike-guardian-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/guardian_db?currentSchema=public}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:guardian_user}
    password: "${SPRING_DATASOURCE_PASSWORD:GuardianPassword@2026}"

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
  mqtt:
    enabled: true
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: guardian-backend-service
    username: ${MQTT_USERNAME:backend_service}
    password: ${MQTT_PASSWORD:BackendSecret@2026}
    connection-timeout: 3
    keep-alive-interval: 30
    auto-reconnect: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.guardian: DEBUG

---
# H2 In-Memory Profile (chạy độc lập không cần Docker)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:guardian_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
