services:
  # 1. MQTT Broker (Mosquitto)
  mosquitto:
    profiles: ["local-broker"]
    image: eclipse-mosquitto:2.0
    container_name: guardian-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - guardian-net

  # 2. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: guardian-postgres
    restart: always
    environment:
      POSTGRES_DB: guardian_db
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - guardian-net

  # 3. Spring Boot Monolith Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: guardian-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guardian_db
      SPRING_DATASOURCE_USERNAME: guardian_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-10}
      DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-45}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://broker.emqx.io:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - guardian-net

  # 4. ReactJS Frontend Web App
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: guardian-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - guardian-net

networks:
  guardian-net:
    driver: bridge

volumes:
  postgres-data:
