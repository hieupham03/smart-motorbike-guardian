version: '3.8'

services:
  # 1. MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: guardian-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - guardian-net

  # 2. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: guardian-postgres
    restart: always
    environment:
      POSTGRES_DB: guardian_db
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: GuardianPassword@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - guardian-net

  # 3. Spring Boot Monolith Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: guardian-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guardian_db
      SPRING_DATASOURCE_USERNAME: guardian_user
      SPRING_DATASOURCE_PASSWORD: GuardianPassword@2026
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: backend_service
      MQTT_PASSWORD: BackendSecret@2026
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mosquitto
    networks:
      - guardian-net

  # 4. ReactJS Frontend Web App
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: guardian-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - guardian-net

networks:
  guardian-net:
    driver: bridge

volumes:
  postgres-data:
